  - value: "395089:1:50"
    name: "Set local preference to 50"
    description: "Set local preference to 50"
    category: "Local preference"
  - value: "395089:1:150"
    name: "Set local preference to 150"
    description: "Set local preference to 150"
    category: "Local preference"
  - value: "395089:1:450"
    name: "Set member local preference to 450"
    description: "Set member local preference to 450"
