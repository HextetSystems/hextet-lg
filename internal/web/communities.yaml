# AS395089 community reference (human-editable).
#
# Names and descriptions come from the AS395089 README
# (https://github.com/HextetSystems/as395089). Implementation status is NOT
# written per entry: it is derived from the `routeros` evidence below.
#
#   Implemented         the community appears in the RouterOS routing
#                       configuration: an explicit community list, a routing
#                       filter, or a configured matching pattern.
#   Documented/planned  described in the README but absent from the evidence.
#   Unresolved          insufficient evidence; set `status: unresolved` on an
#                       entry to record that explicitly.
#
# "Implemented" means present in the configuration. It does not claim that the
# intended routing behaviour has been independently verified.
routeros:
  source: "RouterOS routing configuration supplied by the operator (community lists, matchers, routing filters)"
  # Communities present in explicit RouterOS community lists. Some are listed
  # without a corresponding action handler being demonstrated; presence in the
  # configuration is what counts here.
  lists:
    # Informational
    - "395089:0:1"
    - "395089:0:2"
    - "395089:0:3"
    - "395089:0:4"
    - "395089:0:6"
    - "395089:0:8"
    - "395089:5:1"
    - "395089:5:2"
    - "395089:5:3"
    - "395089:5:4"
    - "395089:6:10"
    - "395089:6:11"
    - "395089:8:703"
    # Customer and action lists
    - "395089:1:50"
    - "395089:1:150"
    - "395089:1:450"
    - "395089:1:550"
    - "395089:2:0"
    - "395089:3:0"
    - "395089:4:0"
    - "395089:301:0"
    - "395089:302:0"
    - "395089:303:0"
  # Communities that routing filters act on, with the behaviour in the filters.
  filters:
    "395089:0:2": "Customer classification"
    "395089:0:6": "Transit classification"
    "395089:0:8": "Peering classification"
    "395089:5:2": "RPKI valid"
    "395089:6:10": "Les.net"
    "395089:8:703": "MBIX"
    "395089:7:1": "Own-space rejection"
    "395089:7:3": "Bogon-prefix rejection"
    "395089:7:4": "RPKI-invalid rejection"
    "395089:7:5": "Default-route or disallowed-prefix-length rejection"
    "395089:1:50": "Local preference action"
    "395089:1:450": "Local preference action"
    "395089:1:550": "Local preference action"
    "395089:2:0": "AS-path prepend once"
    "395089:3:0": "AS-path prepend twice"
    "395089:4:0": "No export"
    "395089:301:0": "Export restriction (member routes)"
    "395089:302:0": "Export restriction (transit routes)"
    "395089:303:0": "Export restriction (peer routes)"
  # Regular expressions used by community matchers. They match the whole
  # large-community string, so they also cover per-ASN and per-IXP variants
  # such as 395089:2:<asn> or 395089:8:<peeringdb-id>.
  patterns:
    - "395089:[05678]:.*"
    - "395089:[1234]:.*"

communities:
  - value: "395089:0:1"
    name: "Self routes"
    description: "Self routes"
    category: "Route classification"
  - value: "395089:0:2"
    name: "Downstream routes"
    description: "Downstream routes"
    category: "Route classification"
    notes: "The RouterOS routing filters treat this as the customer classification."
  - value: "395089:0:3"
    name: "Unspecified route classification"
    description: "Unspecified route classification"
    category: "Route classification"
  - value: "395089:0:4"
    name: "Unspecified route classification"
    description: "Unspecified route classification"
    category: "Route classification"
  - value: "395089:0:6"
    name: "Transit routes"
    description: "Transit routes"
    category: "Route classification"
  - value: "395089:0:8"
    name: "Peering routes"
    description: "Peering routes"
    category: "Route classification"
  - value: "395089:5:1"
    name: "Accepted with valid IRR entry"
    description: "Accepted with valid IRR entry"
    category: "Validation and filtering"
  - value: "395089:5:2"
    name: "Accepted with valid ROA"
    description: "Accepted with valid ROA"
    category: "Validation and filtering"
  - value: "395089:5:3"
    name: "Not described in the README"
    description: "Present in the RouterOS community list, but the README does not document its meaning."
    category: "Undocumented in README"
    notes: "Meaning unknown; not inferred."
  - value: "395089:5:4"
    name: "RPKI invalid accepted by whitelist"
    description: "RPKI invalid accepted by whitelist"
