name: hextet-lg-example

services:
  hextet-lg:
    # For production, set HEXTET_LG_IMAGE to a release digest.
    image: ${HEXTET_LG_IMAGE:-ghcr.io/hextetsystems/hextet-lg:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../configs/config.docker.yaml:/etc/hextet-lg/config.yaml:ro
    stop_grace_period: 45s
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
