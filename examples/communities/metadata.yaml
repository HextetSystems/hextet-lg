# Optional Community Explorer metadata for the AS395089 definitions in
# as395089.txt. The legacy NLNOG format carries only community and description,
# so the operator's classification lives here. It is presentation only: it never
# affects route search or description lookup. Restart the application to reload.
#
# status (all values here were derived from the operator's RouterOS configuration):
#   implemented   the community appears in the RouterOS routing configuration: an
#                 explicit community list, a routing filter, or a configured
#                 matching pattern (named in `evidence`).
#   documented    described in the README but absent from the configuration.
#   unresolved    insufficient evidence to classify.
# "implemented" means present in the configuration. It does not claim that the
# intended routing behaviour has been independently verified.
#
# Keys are the canonical definition text from as395089.txt.
