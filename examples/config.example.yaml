# Copy this file to configs/config.yaml and set each backend URL to the
# OpenBGPD bgplgd HTTP API address reachable from the application.
#
#   cp examples/config.example.yaml configs/config.yaml
#
# For standalone development set server.listen to port 7000 in config.yaml.
# Compose uses a separate ignored configs/config.docker.yaml with port 8080;
# copy the completed local config to that file and change only its listener.
# Both runtime files are local and ignored by Git. Every looking_glass setting
# below is optional: omitted settings fall back to the defaults shown here, so
# configurations written for earlier versions keep working.
server:
  listen: "0.0.0.0:8080"
  # Legacy site name. Still honoured when site.name (below) is not set, so
  # configurations written for earlier versions keep working; new
  # installations should set site.name instead. If both are set, site.name
  # wins and a warning is logged at startup.
  # title: "Example Networks LG"
  # Request-target, query string, parameter count and HTTP header limits.
  max_url_bytes: 8192
  max_query_bytes: 6144
  max_query_params: 64
  max_header_bytes: 32768
  # Per direct TCP peer token buckets, requests per second and burst size.
  rate_per_second: 10
  rate_burst: 60
  live_rate_per_second: 1
  live_rate_burst: 8
  # How long shutdown waits for in-flight requests before closing their
  # connections. Keep it below the container stop grace period (Compose
  # stop_grace_period: 45s) or Docker will SIGKILL the process mid-shutdown.
  shutdown_grace: 40s

# Deployment identity: who runs this looking glass. The software remains
# "Hextet LG"; everything here is operator data. Every field is optional, and
# an installation without this section shows the generic defaults noted below
# (no operator, no AS number, no logo). Nothing here influences a backend
# query, a filter, or any route result: it is presentation only.
# See docs/BRANDING.md.
site:
  # Site name: the header and every browser tab title ("<page> · <name>").
  # Default: the legacy server.title if set, else "BGP Looking Glass".
  name: "Example Networks LG"
  # Secondary header text (hidden visually on phones). Default: "Network
  # Routing Information". Use "" for none.
  subtitle: "Network Routing Information"
  # Shown in the footer, linked to the website when one is set.
  operator: "Example Networks"
  # The operator's AS number (64500 or "AS64500"); shown in the footer only.
  # It is not a backend, neighbor or search ASN. 64500 is a documentation ASN.
  asn: 64500
  # Absolute http(s) URL (https recommended) and a plain email address.
  website: "https://example.net"
  contact: "noc@example.net"
  branding:
    # Optional logo and favicon, read once at startup from this directory.
    # Give plain file names only (no paths). Logo: png, jpg, gif or svg, up to
    # 512 KiB. Favicon: those or ico, up to 128 KiB. Without a favicon a
    # built-in generic icon (in the theme accent color) is used. In Docker,
    # mount the directory read-only, for example
    #   ./branding:/etc/hextet-lg/branding:ro
    # directory: "/etc/hextet-lg/branding"
    # logo: "logo.svg"
    # favicon: "favicon.png"
    # Plain-text footer note (never HTML). Default: "Powered by Hextet LG".
    # Use "" for none.
    footer: "Powered by Hextet LG"

# Structured logging to stderr (optional; the values shown are the defaults).
# level:  debug | info | warn | error
# format: json (one object per line, for production) | text (for a terminal)
# Routine requests log at info; health checks, static files and rate-limited
# requests log at debug; overload (503) and backend failures log at warn.
# Client cancellations are informational. Query strings, prefixes, backend
# addresses and headers are never logged.
logging:
  level: info
  format: json

# Prometheus metrics (optional, DISABLED by default). Metrics are served by a
# separate listener, never by the public server.listen address, and no
# forwarded header is trusted. Bind to loopback, or to a management address
# that only your collector can reach. Do not publish this port in Compose.
# Inside a container, loopback is reachable only from that container: to let a
# Prometheus container on a shared Docker network scrape it, listen on
# "0.0.0.0:9090" and keep the port unpublished (see README, "Metrics").
metrics:
  enabled: false
  listen: "127.0.0.1:9090"

# Colors (optional). Every key may be omitted; omitted values use the built-in
# themes and configurations without this section keep working. Colors are
# strict #RRGGBB hex values only (no names, no CSS functions); anything else
# fails startup. Changes take effect after a restart. See docs/THEMING.md.
#
#   default: auto  follow the browser/system preference (default)
#            light | dark  start in that theme. A visitor's own choice, made
#            with the theme button, overrides it in that browser (stored in
#            localStorage under "theme"; clear it to return to the default).
#   accent:  one accent color shared by both palettes (links, the primary
#            button, active navigation, focus ring). Variants (hover, subtle
#            background, readable link text, button text) are derived from it.
#
# The shortest useful configuration changes only the accent:
#   theme:
#     accent: "#0D9488"
#
# Route validity (RPKI/ASPA), partial/failed results and warnings use fixed
# status colors that are not configurable and never follow the accent.
# Startup logs a warning when a color pair is below WCAG AA contrast and
# refuses to start when body text is below 3:1 on the page or panel background.
theme:
  default: auto
  accent: "#2563EB"
  light:
    background: "#F7F8FA"     # page
    surface: "#FFFFFF"        # panels, top bar, inputs
    surface_alt: "#F0F2F5"    # table headers, route details, notices
    surface_hover: "#E8ECF1"  # row hover, neutral pills
    border: "#D8DDE3"         # separators and panel borders
    text: "#252B32"
    text_muted: "#626A76"
  dark:
    background: "#111316"
    surface: "#1B1E23"
    surface_alt: "#23272D"
    surface_hover: "#292D34"
    border: "#30353C"
    text: "#E8EBEF"
    text_muted: "#A0A7B2"

looking_glass:
  # Backend preselected in the interface: "all" or an enabled backend id.
  default_backend: "all"

  # Time budget for ONE backend query, including reading the whole streamed
  # response. When it expires, routes that were already fully decoded are kept
  # and the result is marked PARTIAL (reason: timeout). Backends may override
  # it with their own query_timeout.
  query_timeout: 30s

  # Maximum upstream response body per backend query (128 MiB). Enforced while
  # reading; the response is never buffered whole. Reaching it yields a PARTIAL
  # result (reason: response_limit). Large Community and source-AS searches in
  # the default-free zone can legitimately return tens of MiB.
  max_response_bytes: 134217728

  # Maximum estimated memory retained for the decoded routes of one backend
  # query (256 MiB). Decoded routes cost more RAM than their JSON size, so this
  # is bounded separately. Reaching it yields a PARTIAL result (reason:
  # memory_limit). The aggregate limit below also applies.
  max_retained_bytes: 268435456

  # Reaching the aggregate limit below yields a PARTIAL result with reason
  # "capacity". That outcome describes momentary load, so it is never cached.

  # Aggregate estimated retained route bytes, shared across active queries,
  # cached entries, evicted results still being rendered, and overview
  # reservations. Cache bytes are a subset of this limit, not an addition.
  max_total_retained_bytes: 805306368 # 768 MiB
  # Concurrent backend-driven requests including cached rendering, and waiters.
  max_concurrent_work: 8
  max_queued_work: 16

  # Routes per HTML page (and per plaintext page when page= is requested).
  page_size: 100

  # Simultaneous upstream route queries (including prefix searches, e.g.
  # source-AS or community searches) for the whole application instance,
  # across all users and backends. A query that cannot start within half of
  # queue_wait (or half the backend timeout, whichever is less) is busy.
  # At most max_queued_queries may be active or waiting for a slot. Not retried.
  max_concurrent_queries: 2
  queue_wait: 2s
  max_queued_queries: 16

  # Backends queried in parallel for a single request.
  max_concurrent_backends: 4

  # Short-lived in-memory cache of validated route results so that paging
  # through a large result does not re-run it for every page. Cached results are
  # temporary, never historical snapshots. 0s disables caching. Failed queries
  # are never cached, and neither are partial results caused by momentary load
  # (reasons capacity, busy, canceled). Complete results and partial results
  # from deterministic limits (memory_limit, response_limit, timeout, ...) are.
  cache_ttl: 20s
  # Global memory budget (estimated) for cached results.
  cache_max_bytes: 268435456

# Optional application-wide disclosure policy; no routes are excluded by default.
# Uncomment and adapt these examples. Use canonical network CIDRs; match must
# be exactly "exact" or "or-longer". Restart after changing the policy.
# route_visibility:
#   exclude:
#     ipv4:
#       - {prefix: 10.0.0.0/8, match: or-longer}
#       - {prefix: 192.0.2.0/24, match: exact}
#     ipv6:
#       - {prefix: "fd00::/8", match: or-longer}
#       - {prefix: "2001:db8:1234::/48", match: exact}

# Backend URLs are configured here exclusively; never pass them in requests.
backends:
  - id: local
    name: "Local OpenBGPD"
    location: "Winnipeg"
    url: "http://openbgpd.example.invalid:9099"
    enabled: true
    # Optional per-backend override of looking_glass.query_timeout, e.g. for a
    # distant or slower router:
    # query_timeout: 60s

# The three community flags control search availability only; route attributes
# and the Community Explorer remain visible. Omitted values default to true,
# true and false respectively.
#
# bgp_neighbors and rtr_sessions switch whole views and are independent of each
# other (disabling one never disables the other). A disabled view has no
# navigation link and its URL answers 404.
#   bgp_neighbors: the BGP session pages /neighbors and /summary (default true)
#   bgp_maps:      show BGP path map links and the /map page (default true)
#   rtr_sessions:  the RPKI-to-Router session page /rtr (default true). It needs
#                  a bgplgd that provides /rtr (present in OpenBGPD 8.2 to 9.3); a backend
#                  without it is reported as "unsupported", never as "no
#                  sessions", and never prevents startup.
#   rtr_session_addresses: show RTR validator addresses, ports and local
#                  addresses on /rtr (default false). By default validators are
#                  identified only by their bgpd.conf "descr" or an ordinal.
#                  See docs/SESSION_VISIBILITY.md before enabling it.
#   page_timing:   show "Generated in 42.7 ms" in the footer of HTML pages
#                  (default true). It is the server-side time from the start of
#                  request handling until the footer is rendered: it includes
#                  backend queries (or cache/shared-flight waits) and template
#                  generation, and excludes network, browser rendering and the
#                  background ASN/PTR lookups. Disabling it only removes the
#                  display; HTTP metrics and the access log are unaffected.
features:
  communities: true
  large_communities: true
  extended_communities: false
  bgp_neighbors: true
  bgp_maps: true
  rtr_sessions: true
  rtr_session_addresses: false
  page_timing: true

# Optional operator-supplied BGP community definitions (DISABLED by default).
# Files use the legacy NLNOG looking glass text format, one asN.txt per ASN
# ("64500:100,Learned from customer"; wildcards x, nnn, ranges 400-499 and $0
# substitutions). The Community Explorer shows the same text-file definitions.
# See docs/COMMUNITIES.md and examples/communities/. They only enrich how routes
# and the Community Explorer are displayed: searches, URLs and visibility are
# unaffected. They are read once at startup, so restart after editing them.
# When enabled, the directory is required and must be readable; a missing
# directory or a malformed definition stops startup. Nothing is downloaded.
# In Docker, mount the directory read-only at the path below (see compose.yaml).
community_definitions:
  enabled: false
  directory: /etc/hextet-lg/communities

# Optional descriptive ASN names from Team Cymru DNS; off by default.
asn_enrichment:
  enabled: false
  provider: team_cymru
  timeout: 2s
  max_concurrent: 4
  max_lookups_per_page: 64
  cache:
    positive_ttl: 168h
    negative_ttl: 24h
    max_entries: 10000
    persist: false
    path: /var/lib/hextet-lg/asn-cache.json

# Presentation of the Route Explorer (optional; the whole section may be omitted).
# These are display settings only: they never change the OpenBGPD request,
# route parsing, cache keys, search filters or visibility. A hidden column's
# values stay available in the expandable Route details. Changes take effect
# after a restart.
display:
  # Raw JSON disclosures (route rows, BGP neighbors and summary). DISABLED by
  # default: the raw backend objects can reveal internal routing details
  # (router IDs, interface and session internals) that the structured views do
  # not. Enable only for trusted deployments. When false, no Raw JSON control
  # is rendered and the payload is not embedded in the page.
  raw_json: false
  # Show the backend route qualification field in Route details (hidden by default).
  route_qualification: false
  route_columns:
    # Neighbor column in the route table (hidden by default). The neighbor is
    # always available in Route details and in neighbor searches.
    neighbor: false
    # ip   - the neighbor address, e.g. 192.0.2.1
    # name - the reverse DNS (PTR) name, falling back to the address while
    #        unresolved or when there is none: peer1.example.net
    # both - "peer1.example.net (192.0.2.1)", or the address alone
    # Names use the ptr_enrichment cache, workers and per-page limit (see
    # ptr_enrichment below); with ptr_enrichment disabled the address is shown.
    neighbor_format: name
    # RPKI (OVS) and ASPA (AVS) validation columns. Hiding one removes it from
    # the table only; the state stays in Route details and in the filters.
    rpki: true
    aspa: true

# Optional asynchronous reverse DNS for displayed next-hop addresses.
# DNS is never required for route rendering and the cache is memory-only.
ptr_enrichment:
  enabled: false
  timeout: 2s
  max_concurrent: 4
  max_lookups_per_page: 64
  cache:
    positive_ttl: 720h
    negative_ttl: 24h
    max_entries: 10000
