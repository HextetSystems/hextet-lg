# Release: tag-triggered, and the only place anything is published.
#
#   git tag -s v1.1.0 -m "Hextet LG v1.1.0"
#   git push origin v1.1.0
#
# The tagged commit must pass the full CI workflow first (job "ci"); the
# release job needs it, so a failing test cannot result in a published release.
# Pull requests and branch pushes never reach this file.
name: Release

on:
  push:
    tags: ["v*"]

# Nothing is writable by default; the release job asks for exactly what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/hextetsystems/hextet-lg
  GORELEASER_VERSION: v2.20.0

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is a Semantic Version and its commit is on main
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not vMAJOR.MINOR.PATCH[-prerelease]"; exit 1
          fi
          # fetch-depth: 0 above already fetched every branch, including main.
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::$tag does not point at a commit on main; release only reviewed commits"; exit 1
          fi

  ci:
    name: CI
    needs: validate-tag
    uses: ./.github/workflows/ci.yaml
    permissions:
      contents: read

  release:
    name: GoReleaser
    needs: [validate-tag, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the GitHub Release and upload archives
      packages: write # push images to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the exact tagged commit, with history for the changelog
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare release notes from CHANGELOG.md
        shell: bash
        run: |
          set -euo pipefail
          release_version="${GITHUB_REF_NAME%%-*}"
          awk -v heading="## ${release_version}" '
            $0 == heading || index($0, heading " — ") == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean --release-notes=release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record published image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{.Manifest.Digest}}')"
          case "$digest" in sha256:????????????????????????????????????????????????????????????????) ;; *) echo "::error::unexpected digest '$digest'"; exit 1 ;; esac
          {
            echo "image: ${IMAGE}"
            echo "tag: ${tag}"
            echo "commit: ${GITHUB_SHA}"
            echo "digest: ${digest}"
            echo "pin: ${IMAGE}@${digest}"
            echo "tags on this digest:"
            for t in "sha-${GITHUB_SHA::7}" latest; do
              d="$(docker buildx imagetools inspect "${IMAGE}:${t}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
              if [ "$d" = "$digest" ]; then echo "  ${t}"; fi
            done
            echo "platforms:"
            docker buildx imagetools inspect "${IMAGE}@${digest}" | sed -n 's/^ *Platform: */  /p'
          } | tee image-digests.txt
          {
            echo '### Published image'
            echo '```'
            cat image-digests.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          gh release upload "${tag}" image-digests.txt --clobber
